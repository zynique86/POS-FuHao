name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install printer-service dependencies
        run: npm ci
        working-directory: printer-service

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit
